<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="kawaii.css">
    <link rel="icon" type="image/x-icon" href="/assets/icon.png">
    <title>kawaii | my cute little blog! :3</title>
</head>
<body>
    <!-- Header Section -->
    <section id="cute-header">
        <div id="header">
            <div id="cute-signup">
                <button id="signup" class="cute-button" disabled>sign up</button>
                <button id="login" class="cute-button">login</button>
                <button id="help-button">?</button>
            </div>
        </div>
    </section>

    <!-- About the blog section -->
    <section id="about">
        <h2>About This Blog</h2>
        <p>Welcome to my cute little blog! Here, I share my thoughts and experiences in a fun and friendly way. :3</p>
        <img src="/assets/my-cute-image.jpg" id="cute-image">
    </section>

    <hr class="section-divider">

    <!-- Actual Blog Content -->
    <section id="blog-content">
        <div id="posts-container">
            <!-- Blog posts will be dynamically inserted here -->
        </div>
    </section>

    <!-- Footer -->
    <footer id="cute-footer">
        <p>&copy; 2026 My Cute Blog. All rights reserved. :3</p>
    </footer>

    <script src="script.js" defer></script>
</body>
</html>
